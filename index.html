<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="말씀 암송"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=3"><link rel="icon" href="icon-192.png?v=3"><link rel="manifest" href="manifest.webmanifest"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>말씀 암송</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow reading column, like a pocket Bible page. Scripture in a brush-serif, controls in a quiet sans. */
:root{
  --bg:#ECEFEA; --surface:#F8F9F5; --ink:#1B2530; --muted:#5C6870; --line:#D3D9D2;
  --accent:#1E5B6E; --accent-ink:#FFFFFF; --blank:#D6DDD5;
  --new:#6F7A82; --almost:#A86A12; --done:#2B7A4B; --miss:#B3402F; --miss-bg:#F6DDD7;
  --scripture:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11171A; --surface:#192125; --ink:#E5EAE8; --muted:#94A1A4; --line:#2A353A;
  --accent:#74BCCD; --accent-ink:#0D1A1E; --blank:#2C383D;
  --new:#8F9BA1; --almost:#E2AB4E; --done:#6FC48E; --miss:#EE8E7F; --miss-bg:#45231E; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11171A; --surface:#192125; --ink:#E5EAE8; --muted:#94A1A4; --line:#2A353A;
  --accent:#74BCCD; --accent-ink:#0D1A1E; --blank:#2C383D;
  --new:#8F9BA1; --almost:#E2AB4E; --done:#6FC48E; --miss:#EE8E7F; --miss-bg:#45231E; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;word-break:keep-all}
.app{max-width:680px;margin:0 auto;padding-inline:18px;padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--scripture);font-weight:700;font-size:26px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--miss);border-color:var(--miss)}
.btn:disabled{opacity:.45;cursor:default}
.link{color:var(--accent);font-weight:500;min-height:36px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* stage marks: shape carries the state as well as color */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;white-space:nowrap}
.st::before{font-size:13px}
.st0{color:var(--new)} .st0::before{content:"○"}
.st1{color:var(--almost)} .st1::before{content:"◐"}
.st2{color:var(--done)} .st2::before{content:"●"}

.filters{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.filters button{padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-left:1px solid var(--line);min-width:0}
.filters button:first-child{border-left:0}
.filters b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.filters span{font-size:12px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent)}
.filters button[aria-pressed="true"] b,.filters button[aria-pressed="true"] span{color:var(--accent-ink)}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:14px 2px;border-bottom:1px solid var(--line);width:100%}
.item h3{margin:0;font-family:var(--scripture);font-size:19px;font-weight:700;min-width:0}
.item p{margin:0;grid-column:1/-1;color:var(--muted);font-family:var(--scripture);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .meta{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.due{color:var(--accent);font-weight:600}
.empty{padding:36px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}
.empty strong{font-family:var(--scripture);font-size:19px;color:var(--ink)}
.empty p{margin:0;max-width:34em}

label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px}
textarea{min-height:150px;resize:vertical;font-family:var(--scripture);line-height:1.8}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
form{display:flex;flex-direction:column;gap:16px}

h2{font-family:var(--scripture);font-size:24px;margin:0;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{padding:8px 12px;font-size:13px;font-weight:500;border-left:1px solid var(--line);min-height:38px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:4px}
.tabs button{padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{display:flex;flex-direction:column;gap:16px}

.verses{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.verse{display:grid;grid-template-columns:1.9em 1fr;gap:4px;font-family:var(--scripture);font-size:18px;line-height:1.9;letter-spacing:-.01em}
.verse>.n{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--accent);padding-top:.55em;font-variant-numeric:tabular-nums}
.verse>div{min-width:0}
.w{font-family:inherit;font-size:inherit;line-height:inherit;display:inline}
.hid{color:transparent;background:var(--blank);border-radius:4px;user-select:none}
.w.peek .hid{color:inherit;background:none;text-decoration:underline dotted var(--muted);text-underline-offset:5px}
mark{background:var(--miss-bg);color:var(--miss);border-radius:3px;padding:0 1px}
.pct{font-family:var(--ui);font-size:12px;font-weight:600;margin-left:6px;white-space:nowrap}
.ok{color:var(--done)} .soso{color:var(--almost)} .bad{color:var(--miss)}
.bar{display:block;height:.9em;margin-top:.55em;border-radius:4px;background:var(--blank);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.55;transition:width .2s}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.listening{font-family:var(--ui);font-size:12px;color:var(--accent);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--scripture);font-size:17px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:42px}
.chip.wrong{border-color:var(--miss);color:var(--miss)}
.answer{font-family:var(--scripture);font-size:18.5px;line-height:1.9;min-height:3.8em;border-bottom:1px dashed var(--line);padding-bottom:8px}
.answer em{font-style:normal;color:var(--muted)}
.result{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px}
.result .big{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tip{font-size:13px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:5}
</style>

<div class="app">
  <header class="top">
    <button class="brand" data-act="home" aria-label="말씀 목록으로">말씀 암송</button>
    <span class="sub" id="today"></span>
  </header>
  <main id="view" class="pane"></main>
</div>
<div id="toast" role="status" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAGES=['아직 안 외운 말씀','거의 외운 말씀','완전히 외운 말씀'], SHORT=['아직 안 외움','거의 외움','완전히 외움'];
const GAP=[1,3,7], DAY=864e5;
let passages=[], loaded=false, col=null, localMode=false;
let ui={view:'home',filter:'all',id:null,tab:'learn',editId:null};
let learn={mode:0,seed:1}, quiz=null, rec=null;

/* ---------- storage ---------- */
const LS='malsseum-passages';
function readLocal(){try{return JSON.parse(localStorage.getItem(LS))||[]}catch(e){return[]}}
function writeLocal(){try{localStorage.setItem(LS,JSON.stringify(passages))}catch(e){}}
const chains={};
function persist(p){
  if(col){const {id,...body}=p;
    chains[id]=(chains[id]||Promise.resolve()).then(()=>col.doc(id).set(body)).catch(()=>toast('저장하지 못했습니다. 연결을 확인하고 다시 시도해 주세요.'));
  }else writeLocal();
}
function removePassage(id){
  passages=passages.filter(p=>p.id!==id);
  if(col)col.doc(id).delete().catch(()=>toast('삭제하지 못했습니다. 다시 시도해 주세요.'));else writeLocal();
}
function newId(){return col?col.doc().id:'p'+Date.now().toString(36)}
const cur=()=>passages.find(p=>p.id===ui.id);
const isDue=p=>!p.last||Date.now()-p.last>=GAP[p.stage]*DAY;

/* ---------- text helpers ---------- */
const norm=s=>s.replace(/[^\p{L}\p{N}]/gu,'');
function startVerse(ref){const m=ref.match(/(\d+)\s*(?:[:：]|장|편)\s*(\d+)/);return m?+m[2]:1}
function parseVerses(raw,start){
  const text=raw.replace(/\r/g,'').trim(); if(!text)return[];
  const re=/(^|\s)(\d{1,3})(?:절|[.:)])?\s*(?=[^\d\s])/g, marks=[]; let m;
  while((m=re.exec(text)))marks.push({num:+m[2],at:m.index+m[1].length,end:re.lastIndex});
  const chain=first=>{const c=[];let e=first;for(const k of marks)if(k.num===e){c.push(k);e++}return c};
  let cuts=chain(start), lead=false;
  if(!cuts.length){cuts=chain(start+1);lead=cuts.length>0}
  if(!cuts.length&&marks.length&&start===1){cuts=chain(marks[0].num)}
  const clean=s=>s.replace(/\s+/g,' ').trim();
  if(!cuts.length)return text.split(/\n+/).map(clean).filter(Boolean).map((t,i)=>({n:start+i,text:t}));
  const out=[];
  if(lead){const t=clean(text.slice(0,cuts[0].at));if(t)out.push({n:start,text:t})}
  cuts.forEach((c,i)=>{const t=clean(text.slice(c.end,i+1<cuts.length?cuts[i+1].at:text.length));if(t)out.push({n:c.num,text:t})});
  return out;
}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* distance from verse t to every prefix of s */
function prefixDist(t,s){
  let prev=Array.from({length:s.length+1},(_,j)=>j);
  for(let i=1;i<=t.length;i++){const c=[i];for(let j=1;j<=s.length;j++)c[j]=Math.min(prev[j]+1,c[j-1]+1,prev[j-1]+(t[i-1]===s[j-1]?0:1));prev=c}
  return prev;
}
/* walk the spoken text verse by verse */
function align(verses,input,final){
  let pos=0,active=false;const out=[];
  for(const v of verses){
    const t=norm(v.text),rest=input.slice(pos);
    if(active||!rest.length){out.push({st:final?'skip':'wait',sim:0});continue}
    const win=rest.slice(0,Math.ceil(t.length*1.4)+4),d=prefixDist(t,win);
    let bj=Math.min(win.length,Math.floor(t.length*.5));
    for(let j=bj;j<=win.length;j++)if(d[j]<d[bj])bj=j;
    const sim=Math.max(0,1-d[bj]/Math.max(t.length,bj));
    const moved=final||rest.length>=t.length*1.25;
    if(sim>=.93||(moved&&sim>=.45)){out.push({st:'done',sim,seg:rest.slice(0,bj)});pos+=bj}
    else if(moved)out.push({st:'skip',sim:0});
    else{out.push({st:'now',prog:Math.min(1,rest.length/t.length)});active=true}
  }
  return out;
}
/* original verse with the parts that were not said marked */
function markMiss(text,seg){
  const idx=[];let t='';
  for(let i=0;i<text.length;i++)if(/[\p{L}\p{N}]/u.test(text[i])){idx.push(i);t+=text[i]}
  const n=t.length,m=seg.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=t[i]===seg[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const miss=new Set();let i=0,j=0;
  while(i<n){if(j<m&&t[i]===seg[j]){i++;j++}else if(j<m&&L[i][j+1]>=L[i+1][j])j++;else{miss.add(idx[i]);i++}}
  let h='',open=false;const letter=new Set(idx);
  for(let k=0;k<text.length;k++){
    if(letter.has(k)){const b=miss.has(k);if(b&&!open){h+='<mark>';open=true}if(!b&&open){h+='</mark>';open=false}}
    else if(open&&text[k]===' '){h+='</mark>';open=false}
    h+=esc(text[k]);
  }
  return h+(open?'</mark>':'');
}

/* ---------- views ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function ago(ts){if(!ts)return'아직 연습 전';const d=Math.floor((Date.now()-ts)/DAY);return d<1?'오늘 연습함':d+'일 전 연습'}
function render(){
  const v=$('#view');
  if(ui.view==='home')v.innerHTML=homeHTML();
  else if(ui.view==='form'){v.innerHTML=formHTML();preview()}
  else if(ui.view==='passage'){const p=cur();if(!p){ui.view='home';return render()}v.innerHTML=passageHTML(p);if(ui.tab==='recite')updateRecite()}
}
function homeHTML(){
  if(!loaded)return`<div class="empty"><p>말씀을 불러오는 중…</p></div>`;
  const cnt=[0,1,2].map(s=>passages.filter(p=>p.stage===s).length);
  const f=ui.filter;
  const list=passages.filter(p=>f==='all'||p.stage===+f).sort((a,b)=>(isDue(b)-isDue(a))||(a.stage-b.stage)||(a.created-b.created));
  const fb=(k,n,l)=>`<button data-act="filter" data-f="${k}" aria-pressed="${f===String(k)}"><b>${n}</b><span>${l}</span></button>`;
  let h=`<div class="filters" role="group" aria-label="암송 단계">${fb('all',passages.length,'전체')}${fb(0,cnt[0],'아직')}${fb(1,cnt[1],'거의')}${fb(2,cnt[2],'완전히')}</div>
  <div class="row spread"><span class="sub">${f==='all'?'등록한 모든 말씀':STAGES[+f]}</span><button class="btn primary" data-act="add">말씀 추가</button></div>`;
  if(!passages.length)h+=`<div class="empty"><strong>첫 암송 말씀을 추가해 보세요</strong><p>성경 앱에서 개역개정 본문을 복사해 붙여넣으면 절 번호를 읽어 한 절씩 나눕니다. 추가한 말씀은 여기에 단계별로 모입니다.</p></div>`;
  else if(!list.length)h+=`<div class="empty"><p>이 단계에 해당하는 말씀이 아직 없습니다.</p></div>`;
  else h+=`<div class="list">${list.map(p=>`<button class="item" data-act="open" data-id="${esc(p.id)}">
      <h3>${esc(p.ref)}</h3><span class="st st${p.stage}">${SHORT[p.stage]}</span>
      <p>${esc(p.verses[0]?.text||'')}</p>
      <span class="meta"><span>${p.verses.length}절</span><span>${ago(p.last)}</span>${p.best!=null?`<span>최고 ${Math.round(p.best*100)}%</span>`:''}${isDue(p)?'<span class="due">오늘 복습</span>':''}</span>
    </button>`).join('')}</div>`;
  if(localMode)h+=`<p class="tip">지금은 이 기기의 브라우저에만 저장됩니다.</p>`;
  return h;
}
function formHTML(){
  const p=ui.editId?passages.find(x=>x.id===ui.editId):null;
  const text=p?p.verses.map(v=>v.n+' '+v.text).join('\n'):'';
  return`<div class="row spread"><h2>${p?'말씀 고치기':'말씀 추가'}</h2><button class="link" data-act="${p?'open':'home'}" data-id="${p?esc(p.id):''}">취소</button></div>
  <form id="f" autocomplete="off">
    <label for="f-ref">말씀 주소<input type="text" id="f-ref" placeholder="예: 시편 23:1-6" value="${p?esc(p.ref):''}"></label>
    <label for="f-text">본문 <span class="hint">성경 앱에서 복사해 그대로 붙여넣으세요. 절 번호가 있으면 자동으로 나눕니다. 번호가 없으면 한 줄을 한 절로 봅니다.</span>
      <textarea id="f-text" placeholder="1 …&#10;2 …&#10;3 …">${esc(text)}</textarea></label>
    <div><div class="sub" id="pv-count"></div><ol class="verses" id="pv"></ol></div>
    <div class="row"><button class="btn primary" id="f-save" type="submit">저장</button>
    ${p?`<span id="del"><button class="btn danger" type="button" data-act="del-ask">삭제</button></span>`:''}</div>
  </form>`;
}
function formVerses(){const ref=$('#f-ref').value.trim();return{ref,verses:parseVerses($('#f-text').value,startVerse(ref))}}
function preview(){
  const {ref,verses}=formVerses();
  $('#pv-count').textContent=verses.length?`${verses.length}절로 나눴습니다. 다르게 나뉘었다면 본문의 절 번호를 확인해 주세요.`:'';
  $('#pv').innerHTML=verses.map(v=>`<li class="verse"><span class="n">${v.n}</span><div>${esc(v.text)}</div></li>`).join('');
  $('#f-save').disabled=!ref||!verses.length;
}

function learnHTML(p){
  const m=learn.mode,ratio=[0,.35,.7][m],r=rng(learn.seed*7919+p.verses.length);

    ${m?`<button class="link" data-act="reseed">다른 단어 가리기</button>`:''}</div>
  ${m?`<p class="tip">가려진 곳을 속으로 채우며 소리 내어 읽어 보세요. 누르면 잠깐 보입니다.</p>`:`<p class="tip">먼저 소리 내어 세 번 읽고, 조금씩 가려 가며 반복하세요.</p>`}
  <ol class="verses">${p.verses.map(v=>`<li class="verse"><span class="n">${v.n}</span><div>${v.text.split(/\s+/).map(w=>wordHTML(w,m,r()<ratio)).join(' ')}</div></li>`).join('')}</ol>`;
}
function startQuiz(p){quiz={k:0,n:0,miss:0,total:0,pool:[],wrong:-1,done:false};loadQuizVerse(p)}
function loadQuizVerse(p){const W=p.verses[quiz.k].text.split(/\s+/);quiz.W=W;quiz.n=0;quiz.pool=shuffle(W.map((_,i)=>i));quiz.total+=W.length}
function quizHTML(p){
  if(!quiz)startQuiz(p);
  if(quiz.done){const s=Math.max(0,1-quiz.miss/quiz.total);
    return`<div class="result"><span class="sub">순서 퀴즈 결과</span><span class="big ${s>=.9?'ok':s>=.7?'soso':'bad'}">${Math.round(s*100)}%</span>
    <span>${quiz.total}개 단어 중 ${quiz.miss}번 틀렸습니다.</span></div>
    <div class="row"><button class="btn primary" data-act="quiz-again">다시 풀기</button><button class="btn" data-act="tab" data-t="recite">암송 확인으로</button></div>`}
  const v=p.verses[quiz.k],W=quiz.W;
  return`<div class="row spread"><span class="sub">${v.n}절 · ${quiz.k+1}/${p.verses.length}</span><span class="sub">틀린 횟수 ${quiz.miss}</span></div>
  <div class="answer">${quiz.n?esc(W.slice(0,quiz.n).join(' ')):'<em>아래 단어를 순서대로 누르세요.</em>'}</div>
  <div class="chips">${quiz.pool.map(i=>`<button class="chip${quiz.wrong===i?' wrong':''}" data-act="chip" data-i="${i}">${esc(W[i])}</button>`).join('')}</div>`;
}
function reciteHTML(p){
  if(!rec)rec={hints:0,hinted:{},final:false,res:[],text:''};
  const top=rec.final?resultHTML(p):`<p class="tip">아래 칸을 누른 뒤 키보드의 마이크 버튼을 눌러 말씀을 처음부터 암송하세요. 직접 입력해도 됩니다. 한 절을 마칠 때마다 맞았는지 바로 표시합니다.</p>`;
  return`${top}
  <ol class="verses" id="rv"></ol>
  <label for="r-in">내가 암송한 말씀<textarea id="r-in" ${rec.final?'disabled':''} placeholder="여기에 말하거나 입력하세요">${esc(rec.text)}</textarea></label>
  <div class="row">${rec.final?`<button class="btn primary" data-act="rec-again">다시 암송</button><button class="btn" data-act="home">목록으로</button>`
    :`<button class="btn primary" data-act="rec-finish">채점하기</button><button class="btn" data-act="rec-hint">힌트 보기</button><button class="btn ghost" data-act="rec-clear">지우기</button>`}</div>`;
}
function resultHTML(p){
  const s=rec.score,cls=s>=.95?'ok':s>=.75?'soso':'bad';
  return`<div class="result"><span class="sub">암송 결과</span><span class="big ${cls}">${Math.round(s*100)}%</span>
  <span class="st st${p.stage}">${STAGES[p.stage]}</span>
  <span class="sub">${rec.hints?`힌트를 ${rec.hints}번 봤습니다. 힌트 없이 95% 이상이면 완전히 외운 말씀이 됩니다.`:s>=.95?'힌트 없이 끝까지 암송했습니다.':'95% 이상이면 완전히 외운 말씀, 75% 이상이면 거의 외운 말씀이 됩니다.'}</span></div>`;
}
function updateRecite(){
  const p=cur(),box=$('#rv');if(!p||!box||!rec)return;
  if(!rec.final)rec.res=align(p.verses,norm(rec.text),false);
  let firstOpen=true;
  box.innerHTML=p.verses.map((v,i)=>{
    const r=rec.res[i]||{st:'wait'};let body;
    if(r.st==='done'){const pc=Math.round(r.sim*100);body=`${markMiss(v.text,r.seg)}<span class="pct ${pc>=95?'ok':pc>=75?'soso':'bad'}">${pc>=95?'✓':''} ${pc}%</span>`}
    else if(r.st==='skip')body=`<mark>${esc(v.text)}</mark><span class="pct bad">빠짐</span>`;
    else{
      const hint=rec.hinted[i]?v.text.split(/\s+/).map(w=>esc(w[0])+'<span class="hid">'+esc(w.slice(1))+'</span>').join(' '):'';
      body=hint||`<span class="bar"><i style="width:${r.st==='now'?Math.round(r.prog*100):0}%"></i></span>`;
      if(r.st==='now'||(firstOpen&&rec.text))body+=`<span class="listening"> 듣는 중</span>`;
      firstOpen=false;
    }
    return`<li class="verse"><span class="n">${v.n}</span><div>${body}</div></li>`}).join('');
}
function finishRecite(){
  const p=cur();rec.res=align(p.verses,norm(rec.text),true);rec.final=true;
  rec.score=rec.res.reduce((a,r)=>a+r.sim,0)/p.verses.length;
  const s=rec.score;
  p.stage=s>=.95&&!rec.hints?2:s>=.75?1:Math.min(p.stage,1);
  p.lastScore=s;p.best=Math.max(p.best||0,s);p.runs=(p.runs||0)+1;p.last=Date.now();
  persist(p);render();window.scrollTo(0,0);
}

/* ---------- events ---------- */
const acts={
  home(){ui.view='home';render()},
  add(){ui.view='form';ui.editId=null;render()},
  edit(){ui.view='form';ui.editId=ui.id;render()},
  filter(el){ui.filter=el.dataset.f;render()},
  open(el){ui.view='passage';ui.id=el.dataset.id||ui.id;ui.tab='learn';learn.mode=0;quiz=null;rec=null;render();window.scrollTo(0,0)},
  tab(el){ui.tab=el.dataset.t;if(ui.tab==='quiz')quiz=null;if(ui.tab==='recite')rec=null;render()},
  stage(el){const p=cur();p.stage=+el.dataset.s;persist(p);render()},
  mode(el){learn.mode=+el.dataset.m;render()},
  reseed(){learn.seed++;render()},
  peek(el){el.classList.toggle('peek')},
  chip(el){const p=cur(),i=+el.dataset.i;
    if(quiz.W[i]===quiz.W[quiz.n]){quiz.pool=quiz.pool.filter(x=>x!==i);quiz.n++;quiz.wrong=-1;
      if(quiz.n===quiz.W.length){if(quiz.k+1<p.verses.length){quiz.k++;loadQuizVerse(p)}else{quiz.done=true;p.last=Date.now();persist(p)}}
    }else{quiz.miss++;quiz.wrong=i}
    render()},
  'quiz-again'(){quiz=null;render()},
  'rec-finish'(){if(!norm(rec.text)){toast('먼저 말씀을 암송해 주세요.');return}finishRecite()},
  'rec-hint'(){const i=rec.res.findIndex(r=>r.st==='now'||r.st==='wait');if(i<0)return;if(!rec.hinted[i]){rec.hinted[i]=true;rec.hints++}updateRecite()},
  'rec-clear'(){rec.text='';$('#r-in').value='';updateRecite();$('#r-in').focus()},
  'rec-again'(){rec=null;render()},
  'del-ask'(){$('#del').innerHTML=`<span class="sub">이 말씀을 지울까요?</span> <button class="btn danger" type="button" data-act="del-yes">지우기</button> <button class="btn" type="button" data-act="del-no">그대로 두기</button>`},
  'del-no'(){render()},
  'del-yes'(){removePassage(ui.editId);ui.view='home';render();toast('삭제했습니다.')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&acts[el.dataset.act])acts[el.dataset.act](el)});
let deb;
document.addEventListener('input',e=>{
  if(e.target.id==='f-ref'||e.target.id==='f-text')preview();
  if(e.target.id==='r-in'&&rec){rec.text=e.target.value;clearTimeout(deb);deb=setTimeout(updateRecite,120)}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const {ref,verses}=formVerses();if(!ref||!verses.length)return;
  let p=ui.editId&&passages.find(x=>x.id===ui.editId);
  if(p){p.ref=ref;p.verses=verses}
  else{p={id:newId(),ref,verses,stage:0,created:Date.now(),last:null,best:null,lastScore:null,runs:0};passages.push(p)}
  persist(p);ui.id=p.id;acts.open({dataset:{}});toast('저장했습니다.');
});

/* ---------- boot ---------- */
$('#today').textContent=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
render();
(async()=>{
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){}
  if(db){col=db.collection('passages');
    col.onSnapshot(s=>{passages=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))}));const first=!loaded;loaded=true;if(first||ui.view==='home')render()},
      ()=>{loaded=true;render();toast('말씀 목록을 불러오지 못했습니다. 페이지를 새로 고쳐 주세요.')});
  }else{passages=readLocal();
    let seeded=false;try{seeded=localStorage.getItem(LS+'-seeded')==='1'}catch(e){}
    if(!seeded&&!passages.length){passages=JSON.parse(JSON.stringify(SEED));writeLocal();try{localStorage.setItem(LS+'-seeded','1')}catch(e){}}
    loaded=true;localMode=true;render()}
})();
</script>
</body></html>
